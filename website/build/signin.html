<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f12" />
    <title>Sign In - GGE Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0f12;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e0e6ed;
            min-height: 100vh;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(13, 15, 18, 0.5);
            border-left: 1px solid rgba(0, 255, 170, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 170, 0.3);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 170, 0.6);
        }

        ::selection {
            background: rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }

        .signin-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(rgba(13, 15, 18, 0.9), rgba(13, 15, 18, 0.95)),
                        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 170, 0.03) 2px, rgba(0, 255, 170, 0.03) 4px);
            background-size: 100% 100%, 100% 4px;
            padding: 20px;
        }

        .signin-panel {
            width: 100%;
            max-width: 420px;
            background: rgba(19, 22, 26, 0.8);
            border: 2px solid rgba(0, 255, 170, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.1);
            padding: 40px;
        }

        .signin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .signin-title {
            font-family: "Share Tech Mono", monospace;
            font-size: 20px;
            font-weight: bold;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .signin-header a {
            color: #00ffaa;
            text-decoration: none;
            font-family: "Share Tech Mono", monospace;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
        }

        .signin-header a:hover {
            text-decoration: underline;
            color: #00cc88;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
        }

        .error-banner {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: #ff3366;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 0;
            font-family: "Share Tech Mono", monospace;
            font-size: 12px;
            display: none;
        }

        .error-banner.show {
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: "Share Tech Mono", monospace;
            font-size: 12px;
            color: #8a9ab0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            background-color: rgba(45, 47, 51, 0.6);
            border: 1px solid rgba(0, 255, 170, 0.3);
            color: #e0e6ed;
            padding: 12px 14px;
            font-family: "Share Tech Mono", monospace;
            font-size: 13px;
            border-radius: 0;
            transition: all 0.2s ease-in-out;
        }

        .form-group input[type="text"]:hover,
        .form-group input[type="password"]:hover {
            border-color: rgba(0, 255, 170, 0.5);
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #00ffaa;
            background-color: rgba(45, 47, 51, 0.8);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #00ffaa;
        }

        .checkbox-group label {
            font-family: "Share Tech Mono", monospace;
            font-size: 13px;
            color: #c9d1df;
            cursor: pointer;
        }

        .signin-button {
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.3);
            color: #00ffaa;
            padding: 12px 20px;
            font-family: "Share Tech Mono", monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border-radius: 0;
        }

        .signin-button:hover:not(:disabled) {
            background: rgba(0, 255, 170, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            border-color: rgba(0, 255, 170, 0.5);
        }

        .signin-button:disabled {
            color: #8a9ab0;
            cursor: not-allowed;
        }

        .signin-footer {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 170, 0.2);
        }

        .signin-footer a {
            color: #8a9ab0;
            text-decoration: none;
            font-family: "Share Tech Mono", monospace;
            font-size: 12px;
            transition: color 0.2s ease-in-out;
        }

        .signin-footer a:hover {
            color: #00ffaa;
        }
    </style>
</head>

<body>
    <div class="signin-container">
        <div class="signin-panel">
            <div class="signin-header">
                <div class="signin-title">Sign In</div>
                <a href="signup.html">Sign Up</a>
            </div>

            <div class="error-banner" id="login-info-banner"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email_name">Username or Email</label>
                    <input type="text" class="input-field" id="email_name" placeholder="Enter your username or email" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Enter your password" />
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember-password" />
                    <label for="remember-password">Remember Password</label>
                </div>

                <button type="submit" class="signin-button">Login</button>
            </form>

            <div class="signin-footer">
                <a href="signup.html">Forgot Password</a>
                <a href="privacypolicy.html">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        function initSignIn() {
            const form = document.getElementById("login-form");
            if (!form) {
                console.error("Form not found");
                return;
            }
            
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                console.log("Form submitted");
                
                const button = form.querySelector("button[type='submit']");
                const emailOrName = document.getElementById("email_name").value;
                const password = document.getElementById("password").value;
                const loginInfoBannerElement = document.getElementById("login-info-banner");
                const isChecked = document.getElementById("remember-password").checked;

                loginInfoBannerElement.classList.remove('show');
                loginInfoBannerElement.innerHTML = "";

                button.disabled = true;
                button.textContent = "LOGGING IN...";

                try {
                    const url = `${location.protocol === 'https:' ? "https" : "http"}://${window.location.hostname}:${location.port}/api`;
                    console.log("Fetching from:", url);
                    
                    const response = await fetch(url, {
                        method: "POST",
                        body: JSON.stringify({ id: 0, email_name: emailOrName, password: password }),
                        headers: {
                            "Content-type": "application/json; charset=UTF-8"
                        }
                    });
                    
                    const json = await response.json();
                    console.log("Response:", json);

                    if (json.uuid) {
                        if (!isChecked) {
                            document.cookie = `uuid=${json.uuid}`;
                        } else {
                            document.cookie = `uuid=${json.uuid};max-age=31536000`;
                        }
                        window.location.replace("/index.html");
                    } else if (json.error) {
                        loginInfoBannerElement.innerHTML = json.error;
                        loginInfoBannerElement.classList.add('show');
                        button.disabled = false;
                        button.textContent = "LOGIN";
                    } else {
                        loginInfoBannerElement.innerHTML = "Login failed";
                        loginInfoBannerElement.classList.add('show');
                        button.disabled = false;
                        button.textContent = "LOGIN";
                    }
                } catch (e) {
                    console.error("Error:", e);
                    loginInfoBannerElement.innerHTML = "Failed to connect to server: " + e.message;
                    loginInfoBannerElement.classList.add('show');
                    button.disabled = false;
                    button.textContent = "LOGIN";
                }
            });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initSignIn);
        } else {
            initSignIn();
        }
    </script>
</body>

</html>
